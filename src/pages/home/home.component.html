<section>

  <ng-container *ngFor="let p of projects">
  <div class="box">
    <img [src]="p.img1" alt="" class="main">

    <div class="container">
      <img [src]="p.img2" alt="">

      <div class="info">
        <h3>{{p.header}}</h3>
        <p>{{p.date}}</p>
        <p>{{p.type}}</p>
      </div>
    </div>
  </div>
  </ng-container>

</section>
